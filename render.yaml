services:
  - type: web
    name: steel-browser-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: cache
      mountPath: /app/.cache
      sizeGB: 1
  - type: web
    name: steel-browser-ui
    runtime: docker
    dockerContext: .
    dockerfilePath: ./ui/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: http://steel-browser-api:10000
